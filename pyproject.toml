[project]
name = "mle-tech-challenge-4-alecrim"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "seaborn>=0.13.2",
]

[dependency-groups]

neuralnetwork = [
    "common",
    "rede_neural",
    "deltalake>=0.22.3",
    "joblib>=1.4.2",
    "mlflow>=2.19.0",
    "psutil>=6.1.1",
    "pynvml>=12.0.0",
    "python-dotenv>=1.0.1",
    "yfinance>=0.2.51",
    "pip>=25.0",
    "torch>=2.6.0",
    "tqdm>=4.67.1",
]

dev = [
    "black[jupyter]>=24.10.0",
    "pytest>=8.3.4",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.5",
    "pytest-cov>=6.0.0",
    "taskipy>=1.14.1",
    "ruff>=0.9.2",
    "ignr>=2.2",
    "requests>=2.32.3",
]

api = [
    "src",
    "common",
    "rede_neural",
    "fastapi[standard]>=0.115.8",
    "pydantic>=2.10.6",
    "mlflow>=2.19.0",
    "torch>=2.6.0",
    "prometheus-client>=0.21.1",
]

[tool.uv.sources]
common = { workspace = true }
rede_neural = { workspace = true }
src = { workspace = true }

[tool.uv.workspace]
members = ["packages/*", "api/*"]

[tool.ruff]
line-length = 88
extend-exclude = ["migrations"]

[tool.ruff.lint]
preview = true
select = ["I", "F", "E", "W", "PL", "PT"]
ignore = ["PLR1711", "E731"]

[tool.ruff.format]
preview = true
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = "."
addopts = "-p no:warnings"

[tool.taskipy.tasks]
lint = "ruff check . && ruff check . --diff"
format = "ruff check . --fix && ruff format ."
pre_test = "task lint"
test = "pytest tests -s -x --cov=packages --cov-report=html:coverage_report -vv"
