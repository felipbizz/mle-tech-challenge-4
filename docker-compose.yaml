services:

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.0
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_TRACKING_URI=sqlite:///mlflow.db
    volumes:
      - ./mlruns:/mlruns
      - ./mlflow.db:/mlflow/mlflow.db
    command: mlflow server --host 0.0.0.0 --port 5000 --default-artifact-root /mlruns

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_MODEL_URI=models:/ProductionModel/latest
    volumes:
      - ./mlruns:/app/mlruns
    ports:
      - "8080:8080" # FastAPI
      - "8000:8000" # Prometheus
    depends_on:
      - mlflow
      - prometheus
      - grafana

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-storage:/var/lib/grafana

volumes:
  api_data:
    driver: local
  grafana-storage:
